[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "nautobot-lab-destination-approvals"
version = "0.2.0"
description = "Destination owner approvals for the Nautobot firewall lab"
requires-python = ">=3.10"

[tool.setuptools.package-data]
destination_approvals = ["templates/destination_approvals/*.html", "static/destination_approvals/*.css"]

[tool.setuptools.packages.find]
include = ["destination_approvals", "destination_approvals.*"]
namespaces = false
